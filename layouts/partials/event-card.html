<div class="w-100 pa2 mb2">
    <article class="ba b--black-10 br3 bg-white shadow-4 overflow-hidden flex items-stretch">
      <!-- Image -->
      <div class="w-40-ns overflow-hidden dn db-ns flex items-center justify-center">
        {{ with .Params.image }}
          <img src="{{ . | relURL }}" 
               class="db mw-100 mh-100"
               style="height: 100%; width: auto;"
               alt="{{ $.Title }}"
               loading="lazy">
        {{ else }}
          <div class="w-100 h-100 bg-gray"></div>
        {{ end }}
      </div>
      
      <!-- Content -->
      <div class="w-100 w-60-ns pa2 flex flex-column justify-between">
        <!-- Category badge -->
       <!--  {{ with .Params.category }}
          <div class="flex items-center mb3">
            <span class="f6 fw6 ttu tracked bg-light-blue blue br2 ph2 pv1 dib">
              {{ . }}
            </span>
          </div>
        {{ end }}-->
        
        <!-- Title + Description -->
        <div>
          <h2 class="f5 fw9 lh-title mb1 dark-gray mt0">
            {{ .Title }}
          </h2>
          <p class="f5 lh-copy gray mb1">
            {{ .Summary | plainify }}
          </p>
        </div>
        
        <!-- Meta info -->
        <div class="bt b--black-10 pt1">
          <div class="flex items-center mb0">
            <svg class="gray w1 h1 mr2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
              <line x1="16" y1="2" x2="16" y2="6"/>
              <line x1="8" y1="2" x2="8" y2="6"/>
              <line x1="3" y1="10" x2="21" y2="10"/>
            </svg>
            <span class="f6 gray ml2"> {{ $t := time.AsTime .Params.date_start }}
              {{ $t | time.Format ":date_medium"}}</span>
          </div>
          {{ with .Params.time_start }}
          <div class="flex items-center mb0">
            <svg class="gray w1 h1 mr2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="10"/>
              <polyline points="12 6 12 12 16 14"/>
            </svg>
            <span class="f6 gray ml2">{{ . }}</span>
          </div>
          {{ end }}
          {{ with .Params.location }}
          <div class="flex items-center">
            <svg class="gray w1 h1 mr2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path d="M20 10c0 7-8 12-8 12s-8-5-8-12a8 8 0 0 1 16 0z"/>
              <line x1="9" y1="22" x2="9" y2="12"/>
              <line x1="15" y1="22" x2="15" y2="12"/>
            </svg>            <span class="f6 gray ml2">{{ . }}</span>
          </div>
          {{ end }}
        </div>
      </div>
    </article>
  </div>
