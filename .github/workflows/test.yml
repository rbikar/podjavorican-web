name: Test build

on: [push, pull_request]

jobs:
  test-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true  # for themes/ananke

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.152.2'      # pin your version
          extended: true

      - name: Build Hugo site
        run: hugo --gc --minify