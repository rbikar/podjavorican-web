name: Build Hugo and Deploy to Railway

on:
  push:
    branches: [ master ]  # or your branch
  schedule:
    - cron: '0 2 * * *'
      timezone: "Europe/Prague"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true  # for themes/ananke

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.152.2'      # pin your version
          extended: true

      - name: Build Hugo site
        run: hugo --gc --minify --baseURL "${{ secrets.RAILWAY_BASE_URL || '/' }}"

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 10
          retry_wait_seconds: 30
          command: railway up --service ${{ secrets.RAILWAY_SERVICE_ID }} --environment production --no-gitignore
          
