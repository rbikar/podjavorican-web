name: Build Hugo and Deploy to Railway

on:
  push:
    branches: [ master ]  # or your branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true  # for themes/ananke

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.154.5'      # pin your version
          extended: true

      - name: Build Hugo site
        run: hugo --gc --minify --baseURL "${{ secrets.RAILWAY_BASE_URL || '/' }}"

      - name: Debug public/
        run: |
          ls -la public/
          test -f public/index.html && echo "OK" || echo "EMPTY!"

      - name: Deploy
        uses: bervProject/railway-deploy@v1
        with:
          railwayToken: ${{ secrets.RAILWAY_TOKEN }}
          serviceId: ${{ secrets.RAILWAY_SERVICE_ID }}
